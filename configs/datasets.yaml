# Dataset configurations for the ML benchmark framework
solar_reference:
  raw_path: data/raw/solar_reference.csv
  target: solar_intensity
  datetime: timestamp
  features:
    - temperature
    - humidity
    - wind_speed
    - pressure
  split:
    method: time
    train_ratio: 0.8
  feature_engineering:
    seasonal: true
    interactions: true
    wavelet: false
    scaling: standard
  notes: |
    This entry is an example placeholder. Update the raw path and feature names
    to match the actual dataset before running the preprocess step.
